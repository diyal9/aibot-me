<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Digital Human - 全能讲师</title>
    <style>
        :root { --accent: #0088aa; --bg: #e8edf2; --panel-bg: rgba(0, 0, 0, 0.06); --board-bg: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; font-family: -apple-system, sans-serif; color: #1a1a2e; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        /* 3D Canvas */
        #c { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer; }
        
        /* Background */
        .bg-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #d4d0cb 0%, #e8e4df 40%, #f0ede8 100%);
            transform: none; z-index: 0; pointer-events: none;
        }
        /* Character back-glow (warm tone) */
        .char-glow {
            position: absolute; top: 22%; left: 50%; width: 85%; height: 48%;
            background: radial-gradient(ellipse at center, rgba(200,195,188,0.5) 0%, rgba(220,215,208,0.3) 40%, transparent 70%);
            transform: translate(-50%, -50%); z-index: 0; pointer-events: none;
        }
        
        /* UI 层 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 顶部信息 */
        .header-bar { display: flex; justify-content: space-between; padding-top: max(20px, env(safe-area-inset-top, 20px)); padding-left: 20px; padding-right: 20px; padding-bottom: 20px; }
        .head { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: rgba(30,30,60,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .head span { color: var(--accent); }

        /* 状态指示器 */
        #status-pill { padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); font-size: 12px; color: #666; border: 1px solid rgba(0,0,0,0.08); display: flex; align-items: center; gap: 6px; transition: all 0.3s ease; position: relative; }
        #status-pill::after {
            content: ''; position: absolute; inset: -2px; border-radius: 14px;
            background: transparent; transition: box-shadow 0.6s;
        }
        #status-pill.listening::after { box-shadow: 0 0 12px rgba(0,136,170,0.3); animation: breathe 2s ease-in-out infinite; }
        #status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #444; transition: background 0.3s; }
        #status-pill.listening .dot { background: #0088aa; box-shadow: 0 0 6px var(--accent); animation: pulse-blue 1.5s infinite; }
        #status-pill.thinking .dot { background: #facc15; box-shadow: 0 0 8px #facc15; animation: pulse-yellow 1s infinite; }
        #status-pill.speaking .dot { background: #ff4444; box-shadow: 0 0 8px #ff4444; animation: pulse-red 1s infinite; }
        #status-pill.greeting .dot { background: #00cc66; box-shadow: 0 0 8px #00cc66; }
        #status-pill.error .dot { background: #ff0000; box-shadow: 0 0 8px #ff0000; }
        @keyframes breathe { 0%,100% { box-shadow: 0 0 6px rgba(0,136,170,0.15); } 50% { box-shadow: 0 0 16px rgba(0,136,170,0.4); } }
        
        /* 情绪指示器 */
        #emotion-indicator { font-size: 16px; margin-right: 6px; animation: emotion-bounce 2s ease-in-out infinite; }
        @keyframes emotion-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
        @keyframes pulse-blue { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }
        @keyframes pulse-yellow { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }
        @keyframes pulse-red { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }

        /* SVG 动态黑板 */
        #blackboard-container {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 700px; height: 55%;
            background: var(--board-bg);
            border: 1px solid rgba(0,0,0,0.12); border-radius: 12px;
            backdrop-filter: blur(10px);
            opacity: 0; transform: translateX(-50%) scale(0.9);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; /* 默认不阻挡点击 */
            z-index: 15; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        #blackboard-container.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
        #blackboard { width: 100%; height: 100%; }
        .blog-item { 
            background: rgba(0,0,0,0.03); margin-bottom:10px; padding:10px; border-radius:8px; 
            border: 1px solid rgba(0,0,0,0.08); cursor:pointer; transition:all 0.2s;
        }
        .blog-item:hover { background: rgba(0,136,170,0.08); border-color: var(--accent); }
        .blog-item.active { background: rgba(0,136,170,0.12) !important; border-color: var(--accent) !important; box-shadow: 0 0 8px rgba(0,136,170,0.2); }
        .blog-title { color: #1a1a2e; font-size: 14px; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .blog-date { color: #888; font-size: 10px; margin-bottom: 4px; }
        .blog-btn { 
            background: transparent; border: none; padding: 4px; 
            font-size: 18px; cursor: pointer; flex-shrink: 0;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0.5;
        }
        .blog-btn:hover { transform: scale(1.2); opacity: 1; }
        .blog-btn:active { transform: scale(0.9); }
        
        /* 模式切换按钮 */
        .mode-switcher {
            position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 12px; z-index: 20;
            opacity: 0.7; /* 默认可见 */ transition: opacity 0.3s; pointer-events: auto;
        }
        .mode-switcher:hover { opacity: 1; }
        .mode-btn {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.08);
            color: #1a1a2e; font-size: 20px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px); transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .mode-btn:hover { background: var(--accent); color: #000; transform: scale(1.15); box-shadow: 0 4px 16px rgba(0,136,170,0.25); }
        .mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* 聊天气泡 */
        #chat-bubble {
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 300px; text-align: center;
            background: #ffffff; border: 1px solid rgba(0,0,0,0.08);
            border-radius: 18px; padding: 12px 20px; color: #1a1a2e; font-size: 15px; line-height: 1.6;
            letter-spacing: 0.02em;
            opacity: 0; transform: translateX(-50%) translateY(20px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-left: 3px solid var(--accent);
        }
        #chat-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        #chat-bubble.user { background: rgba(0,136,170,0.05); border-color: rgba(0,136,170,0.2); color: #006680; border-left-color: var(--accent); }
        #chat-bubble.ai { background: #ffffff; border-color: rgba(0,0,0,0.08); }
        #chat-bubble.error { background: rgba(255,68,68,0.05); border-color: rgba(255,68,68,0.15); color: #cc3333; border-left-color: #ff4444; }

        /* 底部输入区域 */
        .input-area { padding: 15px 20px 25px; background: linear-gradient(to top, rgba(255,255,255,0.98) 0%, rgba(232,237,242,0.6) 60%, transparent 100%); pointer-events: auto; z-index: 20; }
        .pill-container { display: flex; align-items: center; background: #ffffff; border: 1px solid rgba(0,0,0,0.1); border-radius: 24px; height: 48px; width: 100%; max-width: 360px; margin: 0 auto; overflow: hidden; transition: all 0.3s; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .pill-btn { height: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #1a1a2e; font-size: 20px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .pill-btn:active { background: rgba(0,0,0,0.06); transform: scale(0.92); }
        .voice-main-area { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; color: #1a1a2e; font-size: 15px; font-weight: 500; cursor: pointer; background: transparent; border: none; transition: background 0.3s; letter-spacing: 0.03em; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .voice-main-area.recording { color: #ff4444; animation: pulse-red 1.5s infinite; background: rgba(255,68,68,0.15); }
        .voice-main-area.speaking-active { color: var(--accent); animation: pulse-blue 1.5s infinite; background: rgba(0,136,170,0.1); }
        
        .input-mode-content { display: none; flex: 1; height: 100%; align-items: center; padding: 0 4px; }
        .pill-container.is-typing .voice-main-area { display: none; }
        .pill-container.is-typing .switch-btn { display: none; }
        .pill-container.is-typing .input-mode-content { display: flex; }
        .pill-container.is-typing .voice-switch-btn { display: flex; }
        .pill-container.is-typing .send-btn { display: flex; }
        input { flex: 1; height: 100%; background: transparent; border: none; color: #1a1a2e; font-size: 16px; outline: none; padding: 0 8px; }
        .voice-switch-btn { display: none; color: #888; }
        .send-btn { display: none; color: var(--accent); font-size: 22px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        #loader { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #progress-track { width: 200px; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin-top: 15px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        #loader-text { margin-top: 15px; font-size: 12px; color: #888; }
        #start-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 60%, rgba(232,228,223,0.7) 0%, rgba(228,224,218,0.85) 100%);
            backdrop-filter: blur(4px);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            padding: 16px 40px;
            background: linear-gradient(135deg, #0088aa 0%, #006680 100%);
            color: #fff; font-size: 16px; font-weight: 600;
            border-radius: 28px; border: none;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 20px rgba(0,136,170,0.35), 0 2px 6px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative; overflow: hidden;
            display: flex; align-items: center; gap: 8px;
        }
        .start-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            border-radius: inherit;
        }
        .btn-wave {
            font-size: 22px;
            display: inline-block;
            animation: float-bounce 2s ease-in-out infinite;
        }
        @keyframes float-bounce {
            0%,100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(3px) rotate(5deg); }
            60% { transform: translateY(-1px) rotate(0deg); }
        }
        .start-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 30px rgba(0,136,170,0.45), 0 4px 10px rgba(0,0,0,0.15);
        }
        .start-btn:active {
            transform: translateY(0) scale(0.97);
            box-shadow: 0 2px 8px rgba(0,136,170,0.3);
        }
        .start-subtitle {
            margin-top: 12px; font-size: 12px; color: rgba(0,0,0,0.35);
            letter-spacing: 0.03em;
        }
        #error-msg { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; text-align: center; background: #fff; padding: 20px; border-radius: 10px; z-index: 300; border: 1px solid rgba(255,68,68,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="char-glow"></div>
    <div id="c"></div>
    
    <!-- SVG 动态黑板 -->
    <div id="blackboard-container">
        <svg id="blackboard" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <!-- 绘制层 -->
            <g id="board-content"></g>
        </svg>
        <!-- 博客列表层 (HTML overlay) -->
        <div id="blog-list-overlay" style="display:none; width:100%; height:100%; padding:20px; overflow-y:auto; box-sizing:border-box;">
            <div style="color:#0088aa; font-size:18px; font-weight:bold; margin-bottom:15px; text-align:center;">📝 最新博客</div>
            <div id="blog-list-items"></div>
        </div>
        <!-- 数学题库列表层 -->
        <div id="math-overlay" style="display:none; width:100%; height:100%; padding:15px; overflow-y:auto; box-sizing:border-box; background:rgba(255,255,255,0.95);">
            <!-- 阶段1: 日期选择 -->
            <div id="math-day-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px; padding-bottom:20px;">
                <!-- 由 JS 生成 7 个日期按钮 -->
            </div>
            <!-- 阶段2: 题目列表 -->
            <div id="math-question-list" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #ddd;">
                    <button onclick="mathBackToDays()" style="background:none; border:none; color:#0088aa; cursor:pointer; font-size:14px;">← 返回日期</button>
                    <span id="math-current-day-title" style="font-weight:bold; color:#666;"></span>
                </div>
                <div style="display:flex; gap:6px; margin-bottom:12px; font-size:11px;">
                    <span style="background:rgba(0,136,170,0.1); color:#0088aa; padding:2px 8px; border-radius:4px;">基础 ×3</span>
                    <span style="background:rgba(255,165,0,0.1); color:#ffa500; padding:2px 8px; border-radius:4px;">奥数 ×1</span>
                    <span style="background:rgba(0,204,102,0.1); color:#00cc66; padding:2px 8px; border-radius:4px;">思维 ×1</span>
                </div>
                <div id="math-question-items"></div>
            </div>
        </div>
        <!-- 数学讲解按钮容器 -->
        <div id="math-controls" style="display:none; position:absolute; bottom:0; left:0; width:100%; padding:15px; background:linear-gradient(to top, rgba(232,237,242,0.95), transparent); text-align:center;">
            <button id="btn-math-explain" onclick="startMathExplanation()" style="padding:12px 30px; background:#0088aa; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 4px 12px rgba(0,136,170,0.3);">🔊 点击开始讲解</button>
            <button onclick="mathBackToList()" style="padding:10px 20px; background:rgba(255,255,255,0.8); color:#666; border:1px solid rgba(0,0,0,0.1); border-radius:8px; font-size:14px; cursor:pointer; margin-left:10px;">返回题目</button>
        </div>
    </div>

    <!-- 模式切换按钮 -->
    <div class="mode-switcher">
        <button class="mode-btn" onclick="triggerMode('math')" title="数学辅导模式">📐</button>
        <button class="mode-btn" onclick="triggerMode('blog')" title="博客演讲模式">📝</button>
    </div>

    <div id="ui-layer">
        <div class="header-bar">
            <div class="head"><span>AI</span> TEACHER <span id="version-tag" style="cursor:pointer; opacity:0.6; font-size:11px; font-weight:400; margin-left:8px;">v0.4.82</span></div>
            <div id="status-pill"><span id="emotion-indicator">😊</span><div class="dot"></div><span id="status-text">IDLE</span></div>
        </div>
        
        <div id="chat-bubble">你好，我是你的 AI 讲师。</div>
        
        <div class="input-area">
            <div class="pill-container" id="pill">
                <button class="voice-main-area" id="voice-zone"><span id="voice-icon">🎙️</span><span id="voice-text">授权麦克风</span></button>
                <button class="pill-btn switch-btn" id="switch-to-text">⌨️</button>
                <button class="pill-btn voice-switch-btn" id="switch-to-voice">🎤</button>
                <div class="input-mode-content"><input id="inp" type="text" placeholder="输入消息..." autocomplete="off"></div>
                <button class="pill-btn send-btn" id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">初始化模型...</div>
        <div id="progress-track">
            <div id="progress-fill" style="width: 0%"></div>
        </div>
    </div>
    <div id="start-overlay" style="display:none;">
        <div class="start-btn" id="start-btn"><span class="btn-wave">👆</span> 点击开始互动</div>
        <div class="start-subtitle">AI 讲师已就绪</div>
    </div>
    <div id="debug-log" style="position:fixed; bottom:10px; left:10px; color:red; font-size:12px; z-index:9999; background:rgba(0,0,0,0.7); padding:5px; display:block; border-radius:4px; max-height:40vh; overflow-y:auto;"></div>
    
    <!-- Pose Debug Panel -->
    <div id="pose-debug" style="position:fixed; top:50%; left:10px; transform:translateY(-50%); z-index:9998; background:rgba(20,20,40,0.92); color:#eee; padding:12px; border-radius:10px; font-size:11px; font-family:monospace; display:none; max-height:90vh; overflow-y:auto; min-width:320px; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-size:13px; color:#00f2ff;">🦴 骨骼调试面板</strong>
            <button id="pose-debug-close" style="background:none; border:none; color:#888; font-size:16px; cursor:pointer;">✕</button>
        </div>
        <!-- 状态选择器 -->
        <div style="margin-bottom:12px; display:flex; gap:6px; align-items:center;">
            <span style="color:#aaa; font-size:10px; white-space:nowrap;">调整状态:</span>
            <select id="pose-state-select" style="flex:1; background:#1a1a2e; color:#00f2ff; border:1px solid #333; padding:4px 8px; border-radius:4px; font-size:11px; font-family:monospace; cursor:pointer;">
                <option value="idle">🧍 Idle 待机</option>
                <option value="speaking">🗣️ Speaking 演讲</option>
                <option value="teaching">📐 Teaching 教学</option>
                <option value="thinking">🤔 Thinking 思考</option>
                <option value="greeting">👋 Greeting 问候</option>
            </select>
        </div>
        <div id="pose-sliders"></div>
        <div style="margin-top:12px; border-top:1px solid #333; padding-top:10px;">
            <button id="pose-copy-btn" style="background:#0088aa; color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:11px; width:100%; margin-bottom:6px;">📋 复制当前状态参数</button>
            <button id="pose-copy-all-btn" style="background:#6366f1; color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:11px; width:100%; margin-bottom:6px;">📋 复制全部状态 (JSON)</button>
            <div id="pose-copy-msg" style="color:#4ade80; text-align:center; margin-top:4px; font-size:10px;"></div>
        </div>
    </div>
    <script>
            // Pre-module check (hidden by default, shown via version tag click)
        const dbg = document.getElementById('debug-log');
        dbg.style.display = 'none'; // 默认隐藏
        dbg.innerHTML += 'Browser check: ';
        if (typeof window.onerror !== 'undefined') dbg.innerHTML += 'OK. ';
        if (HTMLScriptElement.supports && HTMLScriptElement.supports('module')) dbg.innerHTML += 'Module supported. ';
        else dbg.innerHTML += 'Module NOT supported. ';
        
        // 骨骼调试面板快捷键：Ctrl+Shift+D
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                e.preventDefault();
                const panel = document.getElementById('pose-debug');
                if (panel) {
                    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                }
            }
        });
    </script>
    <div id="error-msg"><div id="error-content"></div></div>

    <!-- Local Libs (Downloaded) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script type="module">
        // DYNAMIC IMPORTS with cache buster
        (async () => {
            const dbg = document.getElementById('debug-log');
            dbg.innerHTML += 'Attempting Dynamic Imports...<br>';
const cacheBuster = '?v=0.4.72';
            try {
                const THREE = await import('https://47.107.172.201:8089/libs/three.esm.js' + cacheBuster);
                dbg.innerHTML += 'Three Loaded.<br>';
                
                const GLTF = await import('https://47.107.172.201:8089/libs/GLTFLoader.esm.js' + cacheBuster);

            // Markdown 清理函数：提取纯文本
            function stripMarkdown(md) {
                if (!md) return '';

                // 行内代码
                text = text.replace(/`([^`]+)`/g, '$1');
                // 图片 ![alt](url)
                text = text.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1');
                // 链接 [text](url)
                text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
                // 粗体/斜体 **text** / *text* / ~~text~~
                text = text.replace(/\*\*([^*]+)\*\*/g, '$1');
                text = text.replace(/\*([^*]+)\*/g, '$1');
                text = text.replace(/~~([^~]+)~~/g, '$1');
                // 标题 # text
                text = text.replace(/^#{1,6}\s+/gm, '');
                // 列表项前缀
                text = text.replace(/^[\s]*[-*+]\s+/gm, '');
                text = text.replace(/^[\s]*\d+\.\s+/gm, '');
                // 引用 >
                text = text.replace(/^>\s+/gm, '');

                text = text.replace(/^[-*_]{3,}$/gm, '');
                // HTML 标签

                // 多余空行

            function fallbackSpeak(text) {
                return new Promise((resolve) => {

                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-CN';
                    
                    const voices = cachedVoices.length > 0 ? cachedVoices : speechSynthesis.getVoices();
                    const zhVoices = voices.filter(v => v.lang.includes('zh') || v.lang.includes('CN'));

                    if (maleVoice) {

                    try {
                        const resp = await fetch('/tts', {

                        const contentType = resp.headers.get('Content-Type') || '';
                        
                        if (contentType.includes('audio')) {

                            const blob = await resp.blob();
                            const url = URL.createObjectURL(blob);
                            const audio = new Audio(url);
                            
                            // 音频开始播放时才启动口型和SPEAKING状态，确保声音/嘴形/动作完全同步
                            audio.onplaying = () => {

                            audio.onended = () => {

                                stopSimulatedLipSync(); 
                                setState(STATES.IDLE);
                                resolve(); 
                            };
                            audio.onerror = () => {

                                fallbackSpeak(text).then(resolve);

                            await audio.play();

                    if (textMode) {

            function createWavBlob(samples, sampleRate) {

                const view = new DataView(buffer);
                const writeStr = (o, s) => { for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
                writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); writeStr(8, 'WAVE');
                writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
                view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
                writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
                for(let i=0; i<samples.length; i++) view.setInt16(44 + i*2, samples[i], true);
                return new Blob([buffer], { type: 'audio/wav' });
            }

            // 麦克风授权
            async function requestMicPermission() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(t => t.stop());
                    micAuthorized = true;
                    document.getElementById('voice-text').innerText = "按住说话";
                    document.getElementById('voice-icon').innerText = "🎤";
                    return true;
                } catch (e) {
                    showChat('麦克风授权失败，请检查浏览器权限', 'error');
                    return false;
                }
            }

            voiceZone.onpointerup = (e) => { e.preventDefault(); if (isRecording) stopRecordingAndSend(); };
            voiceZone.onpointerleave = (e) => { e.preventDefault(); if (isRecording) stopRecordingAndSend(); };
            voiceZone.ontouchstart = async (e) => { e.preventDefault(); if (window.isVoiceBusy()) return; if (!micAuthorized) { await requestMicPermission(); return; } startRecording(); };
            voiceZone.ontouchend = (e) => { e.preventDefault(); if (isRecording) stopRecordingAndSend(); };
            voiceZone.oncontextmenu = (e) => { e.preventDefault(); };
            
            async function startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micStream = stream;
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    await audioCtx.resume(); // 确保上下文运行
                    
                    console.log('[STT] AudioContext initialized. SampleRate:', audioCtx.sampleRate);
                    
                    const source = audioCtx.createMediaStreamSource(stream);
                    recorderNode = audioCtx.createScriptProcessor(4096, 1, 1);
                    pcmChunks = [];
                    maxAmplitude = 0;

                    recorderNode.onaudioprocess = e => {
                        const ch = e.inputBuffer.getChannelData(0);
                        const buf = new Int16Array(ch.length);
                        for(let i=0;i<ch.length;i++) {
                            let val = Math.max(-1, Math.min(1, ch[i]));
                            buf[i] = val * 0x7FFF;
                            if (Math.abs(val) > maxAmplitude) maxAmplitude = Math.abs(val);
                        }
                        pcmChunks.push(buf);
                    };
                    source.connect(recorderNode);
                    recorderNode.connect(audioCtx.destination);
                    isRecording = true;
                } catch(e) { showChat('无法访问麦克风: ' + e.message, 'error'); }
            }

            function stopRecordingAndSend() {
                if (!isRecording) return;

                if (recorderNode) recorderNode.disconnect();
                if (audioCtx) audioCtx.close();
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                
                let totalLen = pcmChunks.reduce((s, c) => s + c.length, 0);
                let allSamples = new Int16Array(totalLen);
                let offset = 0;
                for (const chunk of pcmChunks) { allSamples.set(chunk, offset); offset += chunk.length; }
                
                console.log('[STT] Max Amplitude:', maxAmplitude.toFixed(4), '| Samples:', totalLen);

                isProcessing = true;
                document.getElementById('voice-text').innerText = "处理中...";
                document.getElementById('voice-icon').innerText = "⏳";

                const formData = new FormData();

            // --- 伪随机数生成器（用日期做种子，保证同一天选的题目一致）---
            function seededRandom(seed) {
                let s = seed;
                return function() {
                    s = (s * 16807 + 0) % 2147483647;
                    return (s - 1) / 2147483646;
                };
            }

            // --- 从题库中按种子选择 N 道不重复题目 ---
            function pickFromBank(bank, count, rng) {
                const indices = Array.from({ length: bank.length }, (_, i) => i);
                // Fisher-Yates shuffle
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                return indices.slice(0, count).map(i => ({ ...bank[i] }));
            }

            // --- 获取某天的题目（dateOffset: 0=今天, -1=昨天, ...）---
            function getDayProblems(dateOffset) {

                const target = new Date(today);
                target.setDate(today.getDate() + dateOffset);
                const seed = target.getFullYear() * 10000 + (target.getMonth() + 1) * 100 + target.getDate();
                const rng = seededRandom(seed);
    
                const g2 = pickFromBank(BANK_G2S2, 3, rng);
                const g3 = pickFromBank(BANK_G3S1, 1, rng);
                const o = pickFromBank(BANK_G3O, 1, rng);
    
                return [
                    ...g2.map(p => ({ ...p, grade: '二下' })),
                    ...g3.map(p => ({ ...p, grade: '三上' })),
                    ...o.map(p => ({ ...p, grade: '三奥' }))
                ];
            }

                const labels = ['今天', '昨天', '前天', '3天前', '4天前', '5天前', '6天前'];
                const dayName = labels[-offset] || `${-offset}天前`;
                const month = d.getMonth() + 1;
                const day = d.getDate();
                return { label: `${month}/${day} (${dayName})`, offset };
            }

                    document.getElementById('voice-text').innerText = "按住说话";
                    document.getElementById('voice-icon').innerText = "🎤";
                    showChat(mode === 'math' ? '📐 数学辅导模式已关闭' : '📝 博客演讲模式已关闭', 'ai');
                    if (mode === 'math') {
                        currentMathPlaying = null;
                    } else if (mode === 'blog') {
                        currentBlogPlaying = null;
                        if (blogReturnListener) {
                            window.removeEventListener('click', blogReturnListener);
                            blogReturnListener = null;
                        }
                    }
                    document.getElementById('blog-list-overlay').style.display = 'none';
                    document.getElementById('blackboard-container').style.display = 'none';
                    document.querySelector('.mode-switcher').style.display = '';
                    if (typeof SVGBoard !== 'undefined') SVGBoard.clear();
                    
                    toggleBoard(false); // 还原人物位置
                    setState(STATES.IDLE);
                    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                    modeSwitching = false; // 释放锁
                    return;
                }
                
                // 先清除旧模式
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                
                if (mode === 'math') {
                    currentMode = 'math';
                    document.getElementById('voice-text').innerText = "演讲中······";
                    showChat('📐 数学辅导模式已激活', 'ai');
                    toggleBoard(true);
                    document.querySelectorAll('.mode-btn')[0].classList.add('active');
                    
                    setTimeout(() => {
                        triggerMathMode();
                    }, 300);
                } else if (mode === 'blog') {
                    currentMode = 'blog';
                    document.getElementById('voice-text').innerText = "演讲中······";
                    document.getElementById('voice-icon').innerText = "🔊";
                    showChat('📝 博客演讲模式已激活', 'ai');
                    setState(STATES.TEACHING); // Use TEACHING to show blackboard
                    toggleBoard(true);
                    // 高亮对应按钮
                    document.querySelectorAll('.mode-btn')[1].classList.add('active');
                    
                    // 隐藏 SVG，显示 HTML 列表
                    document.getElementById('blackboard').style.display = 'none';
                    document.getElementById('blackboard-container').style.display = '';
                    document.getElementById('blog-list-overlay').style.display = 'block';
                    
                    // 重置标题
                    const titleEl = document.getElementById('blog-list-items').previousElementSibling;
                    if (titleEl) {
                        titleEl.innerHTML = '📝 最新博客';
                        titleEl.style.display = 'block';
                    }
                    
                    // 清空旧列表
                    const listContainer = document.getElementById('blog-list-items');
                    listContainer.innerHTML = '<div style="color:#888;text-align:center;">加载中...</div>';
                    
                    // 获取博客数据
                    fetch('/api/blogs').then(res => res.json()).then(blogs => {
                        listContainer.innerHTML = '';
                        if (!blogs || blogs.length === 0) {
                            listContainer.innerHTML = '<div style="color:#888;text-align:center;">暂无博客</div>';
                            return;
                        }
                        
                        blogs.forEach((blog, index) => {
                            const item = document.createElement('div');
                            item.className = 'blog-item';
                            item.innerHTML = `
                                <div class="blog-title">
                                    <span>${index + 1}. ${blog.title}</span>
                                    <button class="blog-btn" id="read-btn-${index}">🔊</button>
                                </div>
                                <div class="blog-date">${blog.date}</div>
                            `;
                            listContainer.appendChild(item);
                        });
                        
                        // 博客朗读互斥 + 字幕显示（复用列表背景框）
                        blogs.forEach((blog, index) => {
                            document.getElementById(`read-btn-${index}`).onclick = async (e) => {
                                e.stopPropagation();
                                if (currentBlogPlaying !== null) return;
                                
                                currentBlogPlaying = index;
                                
const fullContent = blog.content || blog.body || blog.summary;
const cleanText = stripMarkdown(fullContent);
const ttsText = stripEmojis(cleanText);
                                
                                // 隐藏喇叭按钮，标记当前朗读项
                                document.getElementById(`read-btn-${index}`).style.display = 'none';
                                document.getElementById(`read-btn-${index}`).parentElement?.parentElement?.classList.add('active');
                                
                                // 在列表框内显示讲解内容 + "讲解中···"
                                const listContainer = document.getElementById('blog-list-items');
                                const originalContent = listContainer.innerHTML;
                                
                                // 隐藏标题，让讲解内容占满空间
                                const titleEl = listContainer.previousElementSibling;
                                if (titleEl) titleEl.style.display = 'none';
                                
                                listContainer.innerHTML = `
                                    <div id="blog-playing-card" style="background:#ffffff; border:1px solid rgba(0,0,0,0.08); border-left:3px solid #0088aa; border-radius:18px; padding:14px 20px; margin-bottom:10px; max-height:calc(100vh - 300px); overflow-y:auto; box-shadow:0 4px 20px rgba(0,0,0,0.1);">
                                        <div id="blog-playing-title" style="color:#0088aa; font-size:14px; font-weight:bold; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(0,0,0,0.08);"></div>
                                        <div id="blog-playing-text" style="color:#1a1a2e; font-size:13px; line-height:1.7; margin-bottom:12px;"></div>
                                        <div id="speaking-status" style="color:#0088aa; font-size:12px; text-align:center; padding:8px 0; border-top:1px solid rgba(0,0,0,0.06);">
                                            <span style="display:inline-block; width:6px; height:6px; background:#0088aa; border-radius:50%; margin-right:6px; animation:pulse-blue 1s infinite;"></span>
                                            <span id="speaking-status-text">博客演讲已激活</span>
                                        </div>
                                    </div>
                                `;
                                
                                // 填充标题
                                document.getElementById('blog-playing-title').textContent = `📖 ${blog.title}`;
                                
                                // 填充文字（打字机效果）
                                const textEl = document.getElementById('blog-playing-text');
                                let charIdx = 0;
                                const typeInterval = setInterval(() => {
                                    if (charIdx < cleanText.length) {
                                        textEl.textContent += cleanText[charIdx];
                                        charIdx++;
                                    } else {
                                        clearInterval(typeInterval);
                                    }
                                }, 30);
                                
                                // 隐藏其他博客项
                                document.querySelectorAll('.blog-item').forEach((item, i) => {
                                    if (i !== index) item.style.opacity = '0.4';
                                });
                                
                                const thisBlog = index;
                                await speak(ttsText); // 使用过滤表情符号的文本
                                
                                // 朗读结束：更新状态为"讲解完毕"
                                const statusText = document.getElementById('speaking-status-text');
                                const statusDot = document.querySelector('#speaking-status span');
                                if (statusText) statusText.textContent = '讲解完毕 ✓';
                                if (statusDot) { statusDot.style.background = '#4ade80'; statusDot.style.animation = 'none'; }
                                
                                await new Promise(r => setTimeout(r, 1200)); // 停留1.2秒让用户看到完毕提示
                                
                                // 朗读结束：恢复
                                // 朗读结束：恢复
                                if (currentBlogPlaying === thisBlog) {
                                    currentBlogPlaying = null;
                                    if (titleEl) titleEl.style.display = '';
                                    listContainer.innerHTML = originalContent;
                                    document.querySelectorAll('.blog-item').forEach(item => item.style.opacity = '1');
                                    blogs.forEach((b, idx) => {
                                        const btn = document.getElementById(`read-btn-${idx}`);
                                        if (btn) btn.style.display = '';
                                    });
                                }
                            };
                        });
                    }).catch(err => {
                        listContainer.innerHTML = '<div style="color:red;text-align:center;">加载失败</div>';
                    });
                    modeSwitching = false; // 释放锁
                }
            };
            
            window.triggerMode = (mode) => window.switchMode(mode);

            // 版本号点击切换日志显示
            const versionTag = document.getElementById('version-tag');
            if (versionTag) {
                versionTag.onclick = () => {
                    const dbg = document.getElementById('debug-log');
                    if (dbg.style.display === 'none' || !dbg.style.display) {
                        dbg.style.display = 'block';
                        versionTag.style.opacity = '1';
                    } else {
                        dbg.style.display = 'none';
                        versionTag.style.opacity = '0.6';
                    }
                };
            }
            }
        </script>
    </body>
    </html>
