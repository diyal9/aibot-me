# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user root;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen       8089 ssl default_server;
        listen       [::]:8089 ssl default_server;
        server_name  _;
        root         /usr/share/nginx;
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        client_max_body_size 0;

        # 统一 API 代理
	# 数字人 LLM API
	location /llm/ {
		proxy_pass http://127.0.0.1:8085/api/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

        # 数字人 TTS API
        location /tts {
            proxy_pass http://127.0.0.1:8085/tts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

	# 数字人 STT API
	location /stt {
		proxy_pass http://127.0.0.1:8085/stt;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		client_max_body_size 50m;
		proxy_read_timeout 60s;
	}

        location /api/ {
            proxy_pass http://127.0.0.1:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 0;
        }
        
        # 兼容旧路径
        location /upload {
            proxy_pass http://127.0.0.1:3000/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 0;
        }

        location /mkdir {
            proxy_pass http://127.0.0.1:3000/mkdir;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 兼容不带斜杠的访问
        location = /human {
            return 302 /human/;
        }

        # 数字人网关
        # WebSocket proxy for Digital Human
        location /ws {
            proxy_pass http://127.0.0.1:8085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /human/ {
            proxy_pass http://127.0.0.1:8085/;
            add_header X-Debug "MatchedHuman";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI协作平台：强制 /hermesshare/dist/ → /hermesshare/（Vue Router base 是 /hermesshare/）
        location = /hermesshare {
            return 302 /hermesshare/;
        }
        location = /hermesshare/dist/ {
            return 301 /hermesshare/;
        }
        location ~ ^/hermesshare/dist/(.+)$ {
            return 301 /hermesshare/$1;
        }
        # Main SPA: use root + internal error page for SPA fallback
        location /hermesshare/ {
            root /usr/share/nginx/hermesshare;
            error_page 404 =200 /hermesshare_dist_index;
            try_files $uri $uri/ =404;
        }
        # Internal: serve dist/index.html as fallback
        location = /hermesshare_dist_index {
            internal;
            default_type text/html;
            alias /usr/share/nginx/hermesshare/dist/index.html;
        }
        # 协作平台 JS/CSS chunks: /hermesshare/assets/ → dist/assets/
        location /hermesshare/assets/ {
            alias /usr/share/nginx/hermesshare/dist/assets/;
        }
        # AI协作平台 API 代理: /hermesshare/api/* → Hub :8087
        location /hermesshare/api/ {
            proxy_pass http://127.0.0.1:8087/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            charset utf-8;
            index index.html; # 优先加载 index.html

            # 强制 HTML 文件不缓存
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }
}
